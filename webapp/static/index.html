<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradecopier Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e2e4e9;
    --text: #1c1f26;
    --muted: #6b7280;
    --green: #1a8754;
    --red: #d92d20;
    --amber: #b45309;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --card-bg: #1c1f26;
      --border: #2c303a;
      --text: #e7e9ee;
      --muted: #9aa1ae;
      --green: #3ecf8e;
      --red: #f66;
      --amber: #f0b429;
      --accent: #5b8def;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 24px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  main { padding: 0 24px 40px; max-width: 1200px; margin: 0 auto; }
  section { margin-top: 24px; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 14px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .card-title { font-weight: 600; font-size: 15px; }
  .card-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.fresh { background: var(--green); }
  .dot.stale { background: var(--red); }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .badge.ok { color: var(--green); border-color: var(--green); }
  .badge.halted { color: var(--red); border-color: var(--red); background: rgba(217,45,32,0.08); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 12px; }
  .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-value { font-size: 15px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .side-buy { color: var(--green); font-weight: 600; }
  .side-sell { color: var(--red); font-weight: 600; }
  .pl-pos { color: var(--green); font-weight: 600; }
  .pl-neg { color: var(--red); font-weight: 600; }
  .pl-flat { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; padding: 10px 0; }
  .warn-banner {
    border: 1px solid var(--amber);
    color: var(--amber);
    background: rgba(180,83,9,0.08);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 16px;
  }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .section-head h2 { margin: 0; }
  .hidden-toggle {
    display: none;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 6px;
  }
  .hidden-toggle:hover { text-decoration: underline; }
  .hidden-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    width: 22px;
    height: 22px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card--hidden { opacity: 0.55; border-style: dashed; }
  code { background: var(--border); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Tradecopier Dashboard</h1>
  <div class="meta" id="meta">loading…</div>
</header>
<main>
  <div id="warning"></div>

  <section>
    <div class="section-head">
      <h2>Master account(s)</h2>
      <button class="hidden-toggle" id="toggleHiddenMasters" type="button"></button>
    </div>
    <div class="grid" id="masters"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Slave (destination) accounts</h2>
      <button class="hidden-toggle" id="toggleHiddenSlaves" type="button"></button>
    </div>
    <div class="grid" id="slaves"></div>
  </section>
</main>

<script>
const FRESH_LIMIT_SECONDS = 5;
const HIDDEN_MASTERS_KEY = 'tc-hidden-masters';
const HIDDEN_SLAVES_KEY = 'tc-hidden-slaves';

function loadHiddenSet(key) {
  try {
    return new Set(JSON.parse(localStorage.getItem(key) || '[]'));
  } catch (e) {
    return new Set();
  }
}

function saveHiddenSet(key, set) {
  localStorage.setItem(key, JSON.stringify([...set]));
}

const hiddenMasters = loadHiddenSet(HIDDEN_MASTERS_KEY);
const hiddenSlaves = loadHiddenSet(HIDDEN_SLAVES_KEY);
let showHiddenMasters = false;
let showHiddenSlaves = false;

function fmtMoney(n) {
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function freshDot(ageSeconds) {
  const fresh = ageSeconds <= FRESH_LIMIT_SECONDS;
  return `<span class="dot ${fresh ? 'fresh' : 'stale'}"></span>${fresh ? 'live' : ageSeconds.toFixed(1) + 's ago'}`;
}

function fmtPl(n) {
  const cls = n > 0 ? 'pl-pos' : (n < 0 ? 'pl-neg' : 'pl-flat');
  const sign = n > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${fmtMoney(n)}</span>`;
}

function masterCard(m, isHidden) {
  const rows = m.positions.map(p => `
    <tr>
      <td>#${p.ticket}</td>
      <td>${p.symbol}</td>
      <td class="side-${p.type.toLowerCase()}">${p.type}</td>
      <td>${p.volume.toFixed(2)}</td>
      <td>${p.priceOpen}</td>
      <td>${p.sl || '—'}</td>
      <td>${p.tp || '—'}</td>
      <td>${fmtPl(p.profit)}</td>
    </tr>`).join('');

  const action = isHidden ? 'unhide-master' : 'hide-master';
  const glyph = isHidden ? '↺' : '×';
  const label = isHidden ? `Restore master ${m.masterId}` : `Hide master ${m.masterId}`;

  return `
  <div class="card${isHidden ? ' card--hidden' : ''}">
    <div class="card-top">
      <div>
        <div class="card-title">Master ${m.masterId}</div>
        <div class="card-sub">login #${m.login}</div>
      </div>
      <div class="card-actions">
        <div class="card-sub">${freshDot(m.ageSeconds)}</div>
        <button class="icon-btn" type="button" data-action="${action}" data-id="${m.masterId}" title="${label}" aria-label="${label}">${glyph}</button>
      </div>
    </div>
    <div class="stats">
      <div><div class="stat-label">Balance</div><div class="stat-value">${fmtMoney(m.balance)}</div></div>
      <div><div class="stat-label">Equity</div><div class="stat-value">${fmtMoney(m.equity)}</div></div>
      <div><div class="stat-label">Open positions</div><div class="stat-value">${m.posCount}</div></div>
    </div>
    ${m.positions.length ? `
    <div class="table-wrap">
    <table>
      <thead><tr><th>Ticket</th><th>Symbol</th><th>Side</th><th>Vol</th><th>Open</th><th>SL</th><th>TP</th><th>P/L</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>` : '<div class="empty">No open positions</div>'}
  </div>`;
}

function slaveCard(s, isHidden) {
  const rows = s.mapped.map(p => `
    <tr>
      <td>#${p.masterTicket} → #${p.slaveTicket}</td>
      <td>${p.symbol}</td>
      <td>${p.volume.toFixed(2)}</td>
      <td>${p.sl || '—'}</td>
      <td>${p.tp || '—'}</td>
      <td>${fmtPl(p.profit)}</td>
    </tr>`).join('');

  const linkInfo = s.masterLinkMs === null
    ? `<span class="dot stale"></span>no master data seen`
    : (s.masterLinkMs <= 5000
        ? `<span class="dot fresh"></span>linked (${s.masterLinkMs}ms)`
        : `<span class="dot stale"></span>master data ${(s.masterLinkMs/1000).toFixed(1)}s old`);

  const slaveId = `${s.masterId}::${s.login}`;
  const action = isHidden ? 'unhide-slave' : 'hide-slave';
  const glyph = isHidden ? '↺' : '×';
  const label = isHidden ? `Restore slave login ${s.login}` : `Hide slave login ${s.login}`;

  return `
  <div class="card${isHidden ? ' card--hidden' : ''}">
    <div class="card-top">
      <div>
        <div class="card-title">Slave — following ${s.masterId}</div>
        <div class="card-sub">login #${s.login}</div>
      </div>
      <div class="card-actions">
        ${s.halted ? '<span class="badge halted">HALTED</span>' : '<span class="badge ok">ACTIVE</span>'}
        <button class="icon-btn" type="button" data-action="${action}" data-id="${slaveId}" title="${label}" aria-label="${label}">${glyph}</button>
      </div>
    </div>
    <div class="card-sub">${freshDot(s.ageSeconds)} &middot; ${linkInfo}</div>
    <div class="stats">
      <div><div class="stat-label">Balance</div><div class="stat-value">${fmtMoney(s.balance)}</div></div>
      <div><div class="stat-label">Equity</div><div class="stat-value">${fmtMoney(s.equity)}</div></div>
      <div><div class="stat-label">Peak equity</div><div class="stat-value">${fmtMoney(s.peakEquity)}</div></div>
      <div><div class="stat-label">Mapped</div><div class="stat-value">${s.mappedCount}</div></div>
    </div>
    ${s.mapped.length ? `
    <div class="table-wrap">
    <table>
      <thead><tr><th>Ticket (master → slave)</th><th>Symbol</th><th>Vol</th><th>SL</th><th>TP</th><th>P/L</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>` : '<div class="empty">No mirrored positions</div>'}
  </div>`;
}

async function refresh() {
  let data;
  try {
    const res = await fetch('/api/status');
    data = await res.json();
  } catch (e) {
    document.getElementById('meta').textContent = 'Could not reach dashboard server';
    return;
  }

  document.getElementById('meta').textContent =
    `Common folder: ${data.commonFolder}  ·  refreshed ${new Date(data.serverTime * 1000).toLocaleTimeString()}`;

  const warnEl = document.getElementById('warning');
  if (!data.commonFolderExists) {
    warnEl.innerHTML = `<div class="warn-banner">Common folder not found at <code>${data.commonFolder}</code>. Set the <code>TC_COMMON_FOLDER</code> environment variable to the correct path and restart the dashboard.</div>`;
  } else if (data.masters.length === 0 && data.slaves.length === 0) {
    warnEl.innerHTML = `<div class="warn-banner">No TC_Master or TC_Slave snapshot files found yet in <code>${data.commonFolder}</code>. Make sure the EAs are attached to a chart with Algo Trading enabled.</div>`;
  } else {
    warnEl.innerHTML = '';
  }

  const visibleMasters = data.masters.filter(m => showHiddenMasters || !hiddenMasters.has(m.masterId));
  const hiddenMasterCount = data.masters.length - data.masters.filter(m => !hiddenMasters.has(m.masterId)).length;

  document.getElementById('masters').innerHTML = visibleMasters.length
    ? visibleMasters.map(m => masterCard(m, hiddenMasters.has(m.masterId))).join('')
    : `<div class="empty">${hiddenMasterCount ? 'All master accounts are hidden' : 'No master accounts detected'}</div>`;

  const toggleMasters = document.getElementById('toggleHiddenMasters');
  toggleMasters.style.display = hiddenMasterCount ? 'inline-block' : 'none';
  toggleMasters.textContent = showHiddenMasters ? 'Hide dismissed' : `Show ${hiddenMasterCount} hidden`;

  const visibleSlaves = data.slaves.filter(s => showHiddenSlaves || !hiddenSlaves.has(`${s.masterId}::${s.login}`));
  const hiddenSlaveCount = data.slaves.length - data.slaves.filter(s => !hiddenSlaves.has(`${s.masterId}::${s.login}`)).length;

  document.getElementById('slaves').innerHTML = visibleSlaves.length
    ? visibleSlaves.map(s => slaveCard(s, hiddenSlaves.has(`${s.masterId}::${s.login}`))).join('')
    : `<div class="empty">${hiddenSlaveCount ? 'All slave accounts are hidden' : 'No slave accounts detected'}</div>`;

  const toggleSlaves = document.getElementById('toggleHiddenSlaves');
  toggleSlaves.style.display = hiddenSlaveCount ? 'inline-block' : 'none';
  toggleSlaves.textContent = showHiddenSlaves ? 'Hide dismissed' : `Show ${hiddenSlaveCount} hidden`;
}

document.getElementById('masters').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === 'hide-master') hiddenMasters.add(id);
  else if (btn.dataset.action === 'unhide-master') hiddenMasters.delete(id);
  saveHiddenSet(HIDDEN_MASTERS_KEY, hiddenMasters);
  refresh();
});

document.getElementById('slaves').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === 'hide-slave') hiddenSlaves.add(id);
  else if (btn.dataset.action === 'unhide-slave') hiddenSlaves.delete(id);
  saveHiddenSet(HIDDEN_SLAVES_KEY, hiddenSlaves);
  refresh();
});

document.getElementById('toggleHiddenMasters').addEventListener('click', () => {
  showHiddenMasters = !showHiddenMasters;
  refresh();
});

document.getElementById('toggleHiddenSlaves').addEventListener('click', () => {
  showHiddenSlaves = !showHiddenSlaves;
  refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
